services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studyenem
      POSTGRES_PASSWORD: studyenem
      POSTGRES_DB: studyenem
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyenem -d studyenem"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=studyenem;Username=studyenem;Password=studyenem
      # Chave de assinatura dos tokens JWT (mínimo 32 caracteres). Defina JWT_KEY no .env fora do ambiente de desenvolvimento.
      - Jwt__Key=${JWT_KEY:-studyenem-chave-docker-desenvolvimento-altere-em-producao}
      # Login com Google (opcional): ID do cliente OAuth 2.0. Defina GOOGLE_CLIENT_ID no .env
      # para habilitar o botão "Continuar com Google" na tela de login.
      - Google__ClientId=${GOOGLE_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
