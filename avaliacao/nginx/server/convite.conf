# Portão de convite da avaliação remota, incluído no server do nginx do frontend. Só bloqueia com
# ACESSO_RESTRITO=true no .env; no padrão (acesso aberto) o mapa gerado não bloqueia nada.
# As variáveis $convite_link_valido e $convite_bloqueado vêm de conf.d/convites.conf, gerado pelo
# scripts/avaliacao.sh a partir de avaliacao/convites.txt (fora do repositório).
#
# - /convite/<código> válido: grava o cookie e abre a tela de login.
# - Sem o cookie de um convite válido, toda a aplicação responde 403 com uma página explicativa.
# - /health fica livre para o monitor externo.

# URL de teste pública: buscadores não indexam, com acesso aberto ou restrito.
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

location ~ ^/convite/[A-Za-z0-9]+/?$ {
    if ($convite_link_valido = "") { return 403; }
    add_header Set-Cookie "studyenem_convite=$convite_link_valido; Path=/; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax" always;
    add_header Cache-Control "no-store" always;
    # Relativo: o nginx recebe HTTP do túnel, e um Location absoluto sairia como http://.
    absolute_redirect off;
    return 302 /login;
}

if ($convite_bloqueado) { return 403; }

error_page 403 @acesso_restrito;
location @acesso_restrito {
    default_type "text/html; charset=utf-8";
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 403 '<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>StudyENEM: acesso restrito</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F5F9;color:#0F1B3D;font-family:system-ui,sans-serif}
main{max-width:420px;padding:32px 24px;text-align:center}h1{font-size:22px;margin:0 0 12px}p{color:#5B6478;line-height:1.5;margin:0}</style>
</head><body><main><h1>Acesso restrito</h1>
<p>Esta versão do StudyENEM está disponível apenas para os participantes da avaliação. Abra o link de convite que você recebeu por e-mail.</p>
</main></body></html>';
}
